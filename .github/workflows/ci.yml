name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile scripts/harness.py tests/test_harness.py tests/test_review_package.py
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Validate committed JSON examples
        run: |
          python -m json.tool contracts/experiment.schema.json >/dev/null
          python -m json.tool contracts/answer.schema.json >/dev/null
          python -m json.tool contracts/adjudication.schema.json >/dev/null
          python -m json.tool contracts/oracle.schema.json >/dev/null
          python -m json.tool contracts/adjudication-ledger.schema.json >/dev/null
          python -m json.tool experiments/template/experiment.json.example >/dev/null
          python -m json.tool experiments/template/questions.json.example >/dev/null
          python -m json.tool experiments/template/oracle.json.example >/dev/null
          python -m json.tool experiments/template/adjudication-ledger.json.example >/dev/null
          python -m json.tool experiments/template/adjudication.json.example >/dev/null
          python -m json.tool experiments/sdms-product-eval-20260825-review/questions.json >/dev/null
          python -m json.tool experiments/sdms-product-eval-20260825-review/experiment.json.example >/dev/null
          python -m json.tool experiments/sdms-product-eval-20260825-review/oracle.json >/dev/null
          python -m json.tool experiments/sdms-product-eval-20260825-review/answers/baseline.json >/dev/null
          python -m json.tool experiments/sdms-product-eval-20260825-review/answers/candidate.json >/dev/null
          python -m json.tool experiments/sdms-product-eval-20260825-review/adjudication-ledger.json >/dev/null
          python -m json.tool experiments/sdms-product-eval-20260825-review/adjudication.json >/dev/null
          python -m json.tool experiments/sdms-product-eval-20260825-review/comparison.json >/dev/null
          python -m json.tool experiments/sdms-product-eval-20260825-review/package-manifest.json >/dev/null
